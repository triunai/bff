name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    # Windows is a preview until slice S7 (native Windows support) lands.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests and release canary (standard library only)
        run: python -m unittest discover -s tests -v
  privacy:
    runs-on: ubuntu-latest
    # Advisory: becomes blocking after the owner's history rewrite (D4).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Privacy gate over every tracked file
        env:
          BFF_PRIVACY_DENYLIST: ${{ secrets.BFF_PRIVACY_DENYLIST }}
        run: python scripts/privacy_gate.py .
