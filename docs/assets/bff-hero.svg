<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">BFF - Built Fucking Fast</title>
  <desc id="d">Illustration, not a screenshot: a stylised Factory floor with five stations, Intake, Claim, Build, Gate and Land, on a conveyor belt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050b"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#word)"/>

  <!-- wordmark -->
  <text x="60" y="118" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="92" font-weight="700" fill="url(#word)" letter-spacing="4">BFF</text>
  <text x="60" y="158" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="700" fill="#f4ff3a" letter-spacing="3">BUILT FUCKING FAST</text>
  <text x="60" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#c8c8d8">The repository is the memory. The chat is just a process.</text>

  <!-- label -->
  <text x="1140" y="44" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8a8aa0" letter-spacing="2">ILLUSTRATION - NOT A SCREENSHOT</text>

  <!-- conveyor -->
  <rect x="60" y="292" width="1080" height="14" rx="7" fill="#15152a" stroke="#2a2a4a"/>
  <g stroke="#00e5ff" stroke-opacity="0.45" stroke-width="2">
    <path d="M80 299h20M130 299h20M180 299h20M230 299h20M280 299h20M330 299h20M380 299h20M430 299h20M480 299h20M530 299h20M580 299h20M630 299h20M680 299h20M730 299h20M780 299h20M830 299h20M880 299h20M930 299h20M980 299h20M1030 299h20M1080 299h20"/>
  </g>

  <!-- stations -->
  <g font-family="Menlo, Consolas, monospace" text-anchor="middle">
    <g>
      <rect x="360" y="222" width="150" height="56" rx="8" fill="#0d0d1f" stroke="#ff4fd8" stroke-width="2"/>
      <text x="435" y="256" font-size="16" font-weight="700" fill="#ff4fd8" letter-spacing="2">INTAKE</text>
    </g>
    <g>
      <rect x="530" y="222" width="150" height="56" rx="8" fill="#0d0d1f" stroke="#00e5ff" stroke-width="2"/>
      <text x="605" y="256" font-size="16" font-weight="700" fill="#00e5ff" letter-spacing="2">CLAIM</text>
    </g>
    <g>
      <rect x="700" y="222" width="150" height="56" rx="8" fill="#0d0d1f" stroke="#f4ff3a" stroke-width="2"/>
      <text x="775" y="256" font-size="16" font-weight="700" fill="#f4ff3a" letter-spacing="2">BUILD</text>
    </g>
    <g>
      <rect x="870" y="222" width="150" height="56" rx="8" fill="#0d0d1f" stroke="#ff4fd8" stroke-width="2"/>
      <text x="945" y="256" font-size="16" font-weight="700" fill="#ff4fd8" letter-spacing="2">GATE</text>
    </g>
    <g>
      <rect x="1040" y="222" width="100" height="56" rx="8" fill="#0d0d1f" stroke="#00e5ff" stroke-width="2"/>
      <text x="1090" y="256" font-size="16" font-weight="700" fill="#00e5ff" letter-spacing="2">LAND</text>
    </g>
  </g>
  <g stroke="#8a8aa0" stroke-width="2" fill="none">
    <path d="M512 250h16M682 250h16M852 250h16M1022 250h16"/>
  </g>

  <!-- cards on the belt -->
  <g>
    <rect x="378" y="262" width="34" height="22" rx="3" fill="#ff4fd8" fill-opacity="0.85"/>
    <rect x="552" y="262" width="34" height="22" rx="3" fill="#00e5ff" fill-opacity="0.85"/>
    <rect x="722" y="262" width="34" height="22" rx="3" fill="#f4ff3a" fill-opacity="0.85"/>
    <rect x="892" y="262" width="34" height="22" rx="3" fill="#ff4fd8" fill-opacity="0.85"/>
    <rect x="1062" y="262" width="34" height="22" rx="3" fill="#00e5ff" fill-opacity="0.85"/>
    <rect x="262" y="270" width="34" height="22" rx="3" fill="#8a8aa0" fill-opacity="0.5"/>
    <rect x="168" y="270" width="34" height="22" rx="3" fill="#8a8aa0" fill-opacity="0.35"/>
  </g>

  <!-- worker badges -->
  <g font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="605" cy="204" r="11" fill="#00e5ff"/><text x="605" y="208" fill="#05050b">A1</text>
    <circle cx="775" cy="204" r="11" fill="#f4ff3a"/><text x="775" y="208" fill="#05050b">A2</text>
    <circle cx="805" cy="204" r="11" fill="#ff4fd8"/><text x="805" y="208" fill="#05050b">A3</text>
    <circle cx="945" cy="204" r="11" fill="#ff4fd8"/><text x="945" y="208" fill="#05050b">R1</text>
  </g>

  <!-- footer -->
  <text x="60" y="336" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8a8aa0">intent - hydrate - contract - owned lane - evidence - review - fitness - wrap</text>
</svg>
